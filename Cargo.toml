[package]
name = "crow"
version = "0.1.0"
edition = "2021"
description = "A selection-first modal terminal text editor"

[dependencies]
ropey = "1.6"
crossterm = "0.27"
unicode-width = "0.1"
unicode-segmentation = "1"
regex = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-python = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.3"
streaming-iterator = "0.1"
serde_json = "1"
tree-sitter-odin = "1.3.0"
tree-sitter-zig = "1.1.2"
tree-sitter-lua = "0.5.0"

[profile.release]
opt-level = 3
lto = true
# Deliberately not panic = "abort": the panic hook restores the terminal, and
# unwinding gives it the best chance of running cleanly.
